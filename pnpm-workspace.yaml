packages:
  - web
  - apps/*
  - packages/*

# msw is a dev/test dep; its post-install service-worker copy isn't
# needed for build or runtime.
allowBuilds:
  esbuild: set this to true or false
  msw: false

# Hold new releases for 3 days before allowing them into a local install,
# so pulled / hijacked packages have time to be caught and yanked.
minimumReleaseAge: 4320
