packages:
  - packages/*
  - web

# msw is a dev/test dep; its post-install service-worker copy isn't
# needed for build or runtime.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: false

# Hooks and CI run without a TTY; stale module directories should be purged
# without prompting when the workspace shape changes.
confirmModulesPurge: false

# Hold new releases for 3 days before allowing them into a local install,
# so pulled / hijacked packages have time to be caught and yanked.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - 'fast-check@4.9.0'
