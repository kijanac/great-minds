packages:
  - packages/*
  - web

# msw is a dev/test dep; its post-install service-worker copy isn't
# needed for build or runtime.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: false
  # OCR engine bundled with officeparser 8; OCR is not enabled, so its install script isn't needed.
  tesseract.js: false

# Hooks and CI run without a TTY; stale module directories should be purged
# without prompting when the workspace shape changes.
confirmModulesPurge: false

# Hold new releases for 3 days before allowing them into a local install,
# so pulled / hijacked packages have time to be caught and yanked.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - 'fast-check@4.9.0'

# Security floors for transitive dependencies whose parents' ranges allow the fix but
# whose lockfile entries were stuck below it. Scoped to the current major. Remove an entry
# once its parent's own range requires the fixed version.
overrides:
  "@xmldom/xmldom@^0.9": "^0.9.12"
  "postcss@^8": "^8.5.23"
  "nanoid@^3": "^3.3.18"
  "source-map-js@^1": "^1.2.2"
