packages:
  - packages/*
  - web

# msw is a dev/test dep; its post-install service-worker copy isn't
# needed for build or runtime.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: false

# Hooks and CI run without a TTY; stale module directories should be purged
# without prompting when the workspace shape changes.
confirmModulesPurge: false

# Hold new releases for 3 days before allowing them into a local install,
# so pulled / hijacked packages have time to be caught and yanked.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@effect/ai-openai-compat@4.0.0-beta.94'
  - '@effect/ai-openrouter@4.0.0-beta.94'
  - '@effect/platform-node-shared@4.0.0-beta.94'
  - '@effect/platform-node@4.0.0-beta.94'
  - '@effect/sql-pg@4.0.0-beta.94'
  - '@effect/tsgo-darwin-arm64@0.16.3'
  - '@effect/tsgo-darwin-x64@0.16.3'
  - '@effect/tsgo-linux-arm64@0.16.3'
  - '@effect/tsgo-linux-arm@0.16.3'
  - '@effect/tsgo-linux-x64@0.16.3'
  - '@effect/tsgo-win32-arm64@0.16.3'
  - '@effect/tsgo-win32-x64@0.16.3'
  - '@effect/tsgo@0.16.3'
  - '@types/node@26.1.1'
  - '@typescript/native-preview-darwin-arm64@7.0.0-dev.20260707.2'
  - '@typescript/native-preview-darwin-x64@7.0.0-dev.20260707.2'
  - '@typescript/native-preview-linux-arm64@7.0.0-dev.20260707.2'
  - '@typescript/native-preview-linux-arm@7.0.0-dev.20260707.2'
  - '@typescript/native-preview-linux-x64@7.0.0-dev.20260707.2'
  - '@typescript/native-preview-win32-arm64@7.0.0-dev.20260707.2'
  - '@typescript/native-preview-win32-x64@7.0.0-dev.20260707.2'
  - '@typescript/native-preview@7.0.0-dev.20260707.2'
  - 'drizzle-kit@1.0.0-rc.4'
  - 'drizzle-orm@1.0.0-rc.4'
  - 'effect@4.0.0-beta.94'
  - 'fast-check@4.9.0'
