services:
  db:
    image: pgvector/pgvector:pg18
    restart: "no"
    environment:
      POSTGRES_USER: great_minds
      POSTGRES_PASSWORD: great_minds
      POSTGRES_DB: gm_packages_test
    ports:
      - "55434:5432"
    volumes:
      - gm_packages_test_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U great_minds -d gm_packages_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gm_packages_test_pgdata:
