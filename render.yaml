projects:
  - name: great-minds
    environments:
      - name: production
        services:
          # ── Backend (Docker) ──────────────────────────────────────
          - name: great-minds-api
            type: web
            runtime: docker
            plan: standard
            region: virginia
            healthCheckPath: /health
            disk:
              name: data
              mountPath: /data
              sizeGB: 1
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: great-minds-db
                  property: connectionString
              - key: JWT_SECRET
                generateValue: true
              - key: DATA_DIR
                value: /data
              - key: CORS_ORIGINS
                value: '["https://great-minds-web.onrender.com","https://greatmind.dev","https://www.greatmind.dev","http://tauri.localhost","tauri://localhost"]'
              - key: OPENROUTER_API_KEY
                sync: false
              - key: STORAGE_BACKEND
                value: r2
              - key: R2_ACCOUNT_ID
                sync: false
              - key: R2_ACCESS_KEY_ID
                sync: false
              - key: R2_SECRET_ACCESS_KEY
                sync: false
              - key: R2_BUCKET_PREFIX
                value: gm-prod
              - key: RESEND_API_KEY
                sync: false
              - key: RESEND_FROM_EMAIL
                sync: false
              - key: LOG_JSON
                value: "true"

          # ── Background worker (Docker) ────────────────────────────
          - name: great-minds-worker
            type: worker
            runtime: docker
            plan: standard
            region: virginia
            dockerCommand: great-minds worker --concurrency 1
            disk:
              name: data
              mountPath: /data
              sizeGB: 1
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: great-minds-db
                  property: connectionString
              - key: JWT_SECRET
                generateValue: true
              - key: DATA_DIR
                value: /data
              - key: CORS_ORIGINS
                value: '["https://great-minds-web.onrender.com","https://greatmind.dev","https://www.greatmind.dev","http://tauri.localhost","tauri://localhost"]'
              - key: OPENROUTER_API_KEY
                sync: false
              - key: STORAGE_BACKEND
                value: r2
              - key: R2_ACCOUNT_ID
                sync: false
              - key: R2_ACCESS_KEY_ID
                sync: false
              - key: R2_SECRET_ACCESS_KEY
                sync: false
              - key: R2_BUCKET_PREFIX
                value: gm-prod
              - key: RESEND_API_KEY
                sync: false
              - key: RESEND_FROM_EMAIL
                sync: false
              - key: LOG_JSON
                value: "true"

          # ── Frontend (Static) ─────────────────────────────────────
          - name: great-minds-web
            type: web
            runtime: static
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter web run build
            staticPublishPath: web/dist
            headers:
              - path: /*
                name: Cache-Control
                value: public, max-age=0, must-revalidate
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_BASE
                value: https://great-minds-api.onrender.com/v1

        databases:
          - name: great-minds-db
            plan: basic-1gb
            region: virginia
            postgresMajorVersion: 18
            ipAllowList: []
